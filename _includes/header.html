<div id="header">
  <div id="header__content">
    <div id="header__info">
      <div id="header__text">
        <h1><a href="{{ site.baseurl }}/">{{ site.title }}</a></h1>
        {% if site.description and site.description != "" %}<p>{{ site.description }}</p>{% endif %}
      </div>
      <img src="{{ site.owner.avatar }}" alt="Photo of {{ site.owner.name }}">
    </div>
    <ul id="header__nav">
      <li><a href="{{ site.baseurl }}/" class="{% if page.url == '/' %}active__link{% else %}{% endif %}">Main</a>
      </li>
      <li><a href="{{ site.baseurl }}/publications" class="{% if page.url == '/publications/' %}active__link{% else %}{% endif %}">Publications</a></li>
      <li><a href="{{ site.baseurl }}/projects" class="{% if page.url == '/projects/' %}active__link{% else %}{% endif %}">Projects</a></li>
      <li><a href="https://github.com/{{ site.owner.github }}" class="">Github</a></li>
    </ul>
  </div>
</div>
